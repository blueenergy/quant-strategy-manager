# GitHub Actions CI for quant-strategy-manager
# This workflow runs tests on push and pull request events, and builds/pushes Docker image

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout quant-strategy-manager
        uses: actions/checkout@v4
        with:
          path: quant-strategy-manager

      - name: Validate dependency repo token
        env:
          DEPENDENCY_REPO_TOKEN: ${{ secrets.DEPENDENCY_REPO_TOKEN }}
        run: |
          if [ -z "$DEPENDENCY_REPO_TOKEN" ]; then
            echo "DEPENDENCY_REPO_TOKEN is required to checkout private dependency repositories."
            exit 1
          fi

      - name: Checkout data-access-lib
        uses: actions/checkout@v4
        with:
          repository: blueenergy/data-access-lib
          path: data-access-lib
          token: ${{ secrets.DEPENDENCY_REPO_TOKEN }}

      - name: Checkout vnpy-live-trading
        uses: actions/checkout@v4
        with:
          repository: blueenergy/vnpy-live-trading
          path: vnpy-live-trading
          token: ${{ secrets.DEPENDENCY_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: quant-strategy-manager
        run: |
          python -m pip install --upgrade pip
          pip install -e ../data-access-lib
          pip install -e ../vnpy-live-trading
          pip install -e .[test] || pip install pytest

      - name: Run tests
        working-directory: quant-strategy-manager
        run: |
          export PYTHONPATH=$(pwd)/src
          pytest --maxfail=1 --disable-warnings -v test_config_loader.py test_user_filtering.py || echo "No tests found or tests failed, continuing for now"

  docker-build:
    name: Build & Push Docker image (ghcr.io)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [build]
    runs-on: ubuntu-latest
    # A registry push has no timeout of its own. On 2026-09-21 a sibling repo
    # lost 3h36m to one that stalled after the build had finished, and a
    # stalled job here blocks release (needs: below) the same way. The ACR leg
    # no longer runs in CI (host/mirror_to_acr.sh relays instead), so this
    # guards the ghcr leg. A healthy cold build is ~10 min and a warm one ~2,
    # so 20 fails fast without false alarms.
    timeout-minutes: 20
    steps:
      - name: Checkout quant-strategy-manager
        uses: actions/checkout@v4
        with:
          path: quant-strategy-manager

      - name: Checkout data-access-lib
        uses: actions/checkout@v4
        with:
          repository: blueenergy/data-access-lib
          path: data-access-lib
          token: ${{ secrets.DEPENDENCY_REPO_TOKEN }}

      - name: Checkout vnpy-live-trading
        uses: actions/checkout@v4
        with:
          repository: blueenergy/vnpy-live-trading
          path: vnpy-live-trading
          token: ${{ secrets.DEPENDENCY_REPO_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/blueenergy/quant-strategy-manager
          # Final tags now come straight from this job — the manifest job that
          # used to merge the per-arch tags is gone, so no -amd64/-arm64 suffix.
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: quant-strategy-manager/Dockerfile
          # arm64 had no consumer: nothing in quant-infrastructure pins a
          # platform, every target is x86_64, and the relay only mirrors amd64.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Keeps the amd64 scope so the existing cache still hits; the arm64
          # scope is simply abandoned.
          cache-from: type=gha,scope=build-amd64
          cache-to: type=gha,mode=max,scope=build-amd64

  release:
    name: Bump image tag in quant-infrastructure & trigger deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Checkout, wait for the relay, bump, one dispatch POST. The wait has its
    # own 45-minute ceiling (the ghcr->ACR relay sweeps on a timer and a cold
    # cross-border pull is slow), so the job ceiling sits above it. A healthy
    # run is about a minute.
    timeout-minutes: 50
    needs: [build, docker-build]
    steps:
      - name: Compute image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout quant-infrastructure
        uses: actions/checkout@v4
        with:
          repository: blueenergy/quant-infrastructure
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Wait for the tag to reach ACR
        # CI publishes to ghcr only. host/mirror_to_acr.sh on the host relays
        # each sha-* tag into ACR, and the deploy targets pull from there, so
        # the bump below must not happen until the tag is actually readable.
        # Failing here is deliberate: a relay that has stopped working has to
        # surface as a red run and a DingTalk alert, not as a deploy that
        # quietly cannot pull its image.
        env:
          ACR_REGISTRY: crpi-gv3f6mfcrw75qane.cn-hangzhou.personal.cr.aliyuncs.com
          ACR_REPO: wukongquant/quant-strategy-manager
          TAG: ${{ steps.tag.outputs.tag }}
          ALIYUN_USER: ${{ secrets.ALIYUN_USER }}
          ALIYUN_TOKEN: ${{ secrets.ALIYUN_TOKEN }}
        run: bash infra/scripts/wait-for-acr-tag.sh

      - name: Bump versions.env with release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          KEY: QUANT_STRATEGY_MANAGER_IMAGE_TAG
          DEPLOY_LABEL: quant-strategy-manager
          SOURCE_REPO: ${{ github.repository }}
          NEW_SHA: ${{ github.sha }}
          APP_REPO_DIR: ${{ github.workspace }}
          INFRA_DIR: ${{ github.workspace }}/infra
          SERVICES: quant-strategy-manager
        run: bash infra/scripts/bump-versions-env.sh

      - name: Trigger centralized deploy
        env:
          INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${INFRA_REPO_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/blueenergy/quant-infrastructure/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"services\":\"quant-strategy-manager\",\"tag\":\"${TAG}\"}}"

  notify-dingtalk:
    name: Notify DingTalk on failure
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    needs: [build, docker-build, release]
    uses: blueenergy/quant-infrastructure/.github/workflows/notify-dingtalk.yml@main
    secrets:
      DATA_CONTRACT_WEBHOOK_URL: ${{ secrets.DATA_CONTRACT_WEBHOOK_URL }}
      DATA_CONTRACT_WEBHOOK_SECRET: ${{ secrets.DATA_CONTRACT_WEBHOOK_SECRET }}
    with:
      workflow: ${{ github.workflow }}
      needs_json: ${{ toJSON(needs) }}
